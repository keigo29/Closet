<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1a">
<title>Closet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Closet</h1>
  <span id="source" class="source"></span>
  <button id="openSettings" class="ghost" aria-label="連携を設定">⚙︎</button>
</header>

<main>
  <section id="view-closet" class="view active">
    <div id="summary" class="summary"></div>
    <div id="closetList"></div>
  </section>

  <section id="view-coord" class="view">
    <p class="hint">カテゴリごとに1つずつ選ぶと、下にコーデが並びます。アウターはなしでもOKです。</p>
    <div id="pickers"></div>
    <h2>コーデ</h2>
    <div id="coordPreview" class="flatlay"></div>
    <div class="row">
      <button id="saveCoord">このコーデをレビューに入れる</button>
      <button id="randomCoord" class="ghost">おまかせ</button>
    </div>
  </section>

  <section id="view-today" class="view">
    <div id="todayBox"></div>
  </section>

  <section id="view-review" class="view">
    <div id="reviewList"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="closet" class="active">一覧</button>
  <button data-view="coord">着せ替え</button>
  <button data-view="today">今日</button>
  <button data-view="review">レビュー</button>
</nav>

<dialog id="settings">
  <form method="dialog">
    <h2>連携を設定</h2>
    <p class="hint">Cmd（非公開）を読むためのトークンです。GitHub の Fine-grained personal access token で、対象は Cmd だけ、Contents は Read-only にしてください。トークンはこの端末にだけ保存されます。</p>
    <label>トークン<input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <label>リポジトリ<input id="repo" placeholder="keigo29/Cmd"></label>
    <label>台帳のファイル<input id="ledger" placeholder="Notes/クローゼット.md"></label>
    <label>写真のフォルダ<input id="photoDir" placeholder="Data/closet"></label>
    <h2>レビューを Cmd に送る（なくてもよい）</h2>
    <p class="hint">音声連携と同じ actionwithvoice の Worker を使います。合言葉は「聞く」と同じものです。</p>
    <label>Worker の URL<input id="workerUrl" placeholder="https://actionwithvoice.○○.workers.dev" autocomplete="off"></label>
    <label>合言葉<input id="reviewKey" type="password" autocomplete="off"></label>
    <div class="row">
      <button value="save" id="saveSettings">保存して読み込む</button>
      <button value="demo" id="useDemo" class="ghost">見本データで見る</button>
      <button value="cancel" class="ghost">閉じる</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
